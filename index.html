    <!-- Structured Data - FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Who needs to obtain a VASP license under the Kenya VASP Bill?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Any company (local or foreign with compliance certificate) conducting virtual asset activities in or from Kenya must obtain a license. This includes wallet providers, exchanges, payment processors, brokers, investment advisors, asset managers, and IVAO providers. Natural persons (individuals) are strictly prohibited from operating as VASPs."
          }
        },
        {
          "@type": "Question",
          "name": "Can individuals operate as Virtual Asset Service Providers in Kenya?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Section 9(2) of the VASP Bill explicitly states that natural persons shall NOT carry on the business of virtual asset services in or from Kenya. Only companies incorporated under the Companies Act are eligible for licensing."
          }
        },
        {
          "@type": "Question",
          "name": "What are the penalties for operating without a VASP license in Kenya?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Individuals face up to KES 10 million fine and/or 10 years imprisonment. Companies face up to KES 20 million fine. For continuing offenses, an additional KES 3.75 million per day applies."
          }
        },
        {
          "@type": "Question",
          "name": "Which regulatory authority issues VASP licenses in Kenya?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Capital Markets Authority (CMA) regulates brokers, investment advisors, asset managers, and trading platforms. The Central Bank of Kenya (CBK) regulates payment processors and certain exchange functions. Some activities may fall under both authorities."
          }
        },
        {
          "@type": "Question",
          "name": "How long is a VASP license valid in Kenya?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Licenses are valid from the date of issue until December 31st of the same year, requiring annual renewal. Licenses cannot be transferred or assigned without regulatory approval."
          }
        }
      ]
    }
    </script>
